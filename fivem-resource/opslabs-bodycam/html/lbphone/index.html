<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Xon Sight</title>
  <link rel="stylesheet" href="../app/styles.css" />
  <link rel="stylesheet" href="../app/colors.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="../app/autoscale.js"></script>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <span class="dot"></span>
      <span class="brand">XON<span class="accent">SIGHT</span></span>
      <button id="capture" title="Record evidence" hidden>&#9679;</button>
      <button id="reload" title="Reload">&#8635;</button>
    </div>
    <div class="screen">
      <iframe id="frame" src="about:blank"></iframe>
      <div class="screen-empty" id="screenEmpty">Loading&hellip;</div>
    </div>

    <div class="capture-overlay hidden" id="captureOverlay">
      <div class="capture-card">
        <div class="capture-title">Record evidence</div>
        <p class="capture-hint">Captures video with LB Phone's camera and submits it to Xon Sight directly - no bodycam resource needed.</p>
        <input type="text" id="captureCaption" placeholder="Caption (optional)" maxlength="200" />
        <div class="capture-actions">
          <button id="captureCancel" class="btn-ghost">Cancel</button>
          <button id="captureStart" class="btn-accent">Record</button>
        </div>
        <div class="capture-status" id="captureStatus" hidden></div>
      </div>
    </div>
  </div>

  <script>
    // lb-phone - and Sky Phone's lb-phone compatibility alias (https://github.com/sky-systems/sky_phone#
    // external-custom-apps) - only guarantee fetchNui/onSettingsChange/getSettings/useCamera exist once they
    // post this message.
    window.addEventListener('message', (e) => {
      if (e.data !== 'componentsLoaded') return;

      window.PhoneBridge = {
        getTheme: () => getSettings().then((s) => s.display.theme),
        onThemeChange: (cb) => onSettingsChange((s) => cb(s.display.theme)),
        captureVideo: (opts) => new Promise((resolve) => useCamera((url) => resolve(url || null), opts)),
        // No LB status-bar export - script.js's Sky Phone postMessage fallback covers that phone instead.
      };

      const script = document.createElement('script');
      script.src = '../app/script.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
