<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Xon Sight</title>
  <link rel="stylesheet" href="../app/styles.css" />
  <link rel="stylesheet" href="../app/colors.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="../app/autoscale.js"></script>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <span class="dot"></span>
      <span class="brand">XON<span class="accent">SIGHT</span></span>
      <button id="capture" title="Record evidence" hidden>&#9679;</button>
      <button id="reload" title="Reload">&#8635;</button>
    </div>
    <div class="screen">
      <iframe id="frame" src="about:blank"></iframe>
      <div class="screen-empty" id="screenEmpty">Loading&hellip;</div>
    </div>

    <div class="capture-overlay hidden" id="captureOverlay">
      <div class="capture-card">
        <div class="capture-title">Record evidence</div>
        <p class="capture-hint">Captures video with GKSPHONE's camera and submits it to Xon Sight directly - no bodycam resource needed.</p>
        <input type="text" id="captureCaption" placeholder="Caption (optional)" maxlength="200" />
        <div class="capture-actions">
          <button id="captureCancel" class="btn-ghost">Cancel</button>
          <button id="captureStart" class="btn-accent">Record</button>
        </div>
        <div class="capture-status" id="captureStatus" hidden></div>
      </div>
    </div>
  </div>

  <script>
    // window.gksphone (https://docs.gkshop.org/gksphone-v2/custom-app) is injected once the iframe has
    // loaded - there's no ready message like lb-phone's, so poll briefly instead.
    function boot() {
      if (!window.gksphone) {
        setTimeout(boot, 50);
        return;
      }

      window.PhoneBridge = {
        getTheme: () => Promise.resolve(window.gksphone.isDarkMode() ? 'dark' : 'light'),
        onThemeChange: (cb) => window.gksphone.onChangeDarkMode((dark) => cb(dark ? 'dark' : 'light')),
        captureVideo: () => window.gksphone.CameraOpen(false, true).then((url) => url || null),
        setStatusBarColor: (color) => window.gksphone.setStatusBarColor(color),
      };

      const script = document.createElement('script');
      script.src = '../app/script.js';
      document.body.appendChild(script);
    }

    document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 50));
  </script>
</body>
</html>
