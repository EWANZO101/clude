# opslabs-phone: Spotify/TIDAL sign-in callbacks + phone REST API (FXServer port 30120)
server {
    server_name ops-phone.opslabsystems.cloud;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    # only the phone resource is exposed, not the rest of the FXServer HTTP endpoints
    location ^~ /opslabs-phone/ {
        proxy_pass http://127.0.0.1:30120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 64m;   # camera uploads (videos are sent base64)
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ops-phone.opslabsystems.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ops-phone.opslabsystems.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = ops-phone.opslabsystems.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ops-phone.opslabsystems.cloud;
    return 404; # managed by Certbot


}