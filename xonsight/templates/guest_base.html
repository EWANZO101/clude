<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Xon Sight{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            base: '#0a0a0c',
            panel: '#141417',
            border: '#26262b',
            accent: '#ec4899',
            accent2: '#14b8a6',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0a0c; min-height: 100vh; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-thumb { background: #26262b; border-radius: 8px; }
    .card-label { font-size: 12.5px; color: #8b8b93; font-weight: 500; }
  </style>
</head>
<body class="min-h-screen bg-base text-slate-200 font-sans flex flex-col">
  {% from "_macros.html" import brand_mark %}
  <header class="px-6 sm:px-8 py-6">
    <a href="{{ url_for('site.welcome') }}" class="inline-flex items-center gap-2.5">
      {{ brand_mark() }}
    </a>
  </header>
  <main class="flex-1 flex items-center justify-center px-4 pb-20">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
