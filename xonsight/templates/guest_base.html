<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Xon Sight{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            base: '#0a0a0b',
            panel: '#131315',
            border: '#2c2c30',
            accent: '#dc2626',
            accent2: '#7d8694',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090a;
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 7px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 7px),
        radial-gradient(900px 500px at 15% -10%, rgba(220,38,38,0.07), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(255,255,255,0.03), transparent 60%);
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-thumb { background: #2c2c30; }
    .rounded, .rounded-md, .rounded-lg, .rounded-xl, .rounded-2xl, .rounded-3xl { border-radius: 2px !important; }
  </style>
</head>
<body class="min-h-screen bg-base text-slate-200 font-sans flex flex-col">
  {% from "_macros.html" import brand_mark %}
  <header class="px-6 py-5">
    <a href="{{ url_for('site.welcome') }}" class="inline-flex items-center gap-2.5">
      {{ brand_mark() }}
    </a>
  </header>
  <main class="flex-1 flex items-center justify-center px-4 pb-16">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
