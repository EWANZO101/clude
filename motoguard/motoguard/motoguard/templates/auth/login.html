{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-6">
  <p class="eyebrow mb-1">Welcome back</p>
  <h1 class="font-display font-800 text-2xl text-chalk mb-5">Log in</h1>
  <form method="post" class="space-y-3 card p-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div><label class="label">Email</label><input name="email" type="email" placeholder="you@example.com" class="input" required></div>
    <div><label class="label">Password</label><input name="password" type="password" placeholder="Your password" class="input" required></div>
    <button class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="text-sm text-mute mt-4 text-center">
    <a href="{{ url_for('auth.forgot') }}" class="text-link">Forgot your password?</a>
  </p>
  <p class="text-sm text-mute mt-1 text-center">No account? <a href="{{ url_for('auth.register') }}" class="text-link">Register a bike</a></p>
</div>
{% endblock %}
