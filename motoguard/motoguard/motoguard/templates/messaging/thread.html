{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
<div class="flex items-center justify-between mb-4">
  <h1 class="font-display font-700 text-xl text-chalk">{{ other.username }}</h1>
  <div class="flex gap-3 items-center">
    <form method="post" action="{{ url_for('messaging.report', convo_id=convo.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="reason" value="reported from thread"><button class="text-xs text-mute hover:text-plate">Report</button></form>
    <form method="post" action="{{ url_for('messaging.block', user_id=other.id) }}" onsubmit="return confirm('Block this user?')">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="text-xs text-mute hover:text-stolen">Block</button></form>
  </div>
</div>
<div class="card p-4 space-y-2 mb-3 max-h-[55vh] overflow-y-auto">
{% for m in msgs %}
  <div class="flex {{ 'justify-end' if m.sender_id == current_user.id else 'justify-start' }}">
    <div class="max-w-[78%] rounded-2xl px-3.5 py-2 text-sm {{ 'bg-plate text-[#10140F]' if m.sender_id == current_user.id else 'card-2 text-chalk' }}">
      {% if m.body %}<div>{{ m.body }}</div>{% endif %}
      {% if m.attachment %}<img src="{{ url_for('static', filename='uploads/' + m.attachment) }}" class="rounded-lg mt-1 max-h-48">{% endif %}
      <div class="text-[10px] opacity-60 mt-0.5">{{ m.created_at|ago }}</div>
    </div>
  </div>
{% else %}<p class="text-mute text-sm text-center py-6">Say hello — contact details stay private.</p>{% endfor %}
</div>
<form method="post" enctype="multipart/form-data" class="flex gap-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input name="body" placeholder="Type a message…" class="input flex-1">
  <input type="file" name="attachment" accept="image/*" class="text-xs text-mute w-24">
  <button class="btn btn-primary">Send</button>
</form>
</div>
{% endblock %}
