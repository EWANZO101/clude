{% extends "base.html" %}
{% block content %}
<div class="flex items-end justify-between mb-6 gap-3 flex-wrap">
  <div><p class="eyebrow mb-1">Community</p><h1 class="font-display font-800 text-3xl text-chalk">The forum</h1></div>
  <div class="flex gap-2">
    <form action="{{ url_for('forum.search') }}" class="flex"><input name="q" placeholder="Search…" class="input rounded-r-none w-44"><button class="btn btn-ghost rounded-l-none">Search</button></form>
    {% if current_user.is_authenticated %}<a href="{{ url_for('forum.new_post') }}" class="btn btn-primary">+ New post</a>{% endif %}
  </div>
</div>
<div class="grid sm:grid-cols-2 gap-3">
{% for c in cats %}
  <a href="{{ url_for('forum.category', slug=c.slug) }}" class="card card-hover p-5">
    <div class="flex items-center justify-between"><span class="font-display font-700 text-chalk">{{ c.name }}</span><span class="eyebrow">{{ counts[c.id] }}</span></div>
    <p class="text-mute text-sm mt-1">{{ c.description }}</p>
  </a>
{% endfor %}
</div>
{% endblock %}
