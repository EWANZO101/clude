{% extends "base.html" %}
{% block content %}
<p class="eyebrow mb-1">Moderation</p>
<h1 class="font-display font-800 text-2xl text-chalk mb-5">Sightings</h1>
<div class="space-y-2">
{% for s in sightings %}
  <div class="card p-4 flex justify-between items-center gap-3">
    <div><a class="font-display font-600 text-link" href="{{ url_for('vehicles.detail', vehicle_id=s.vehicle_id) }}">{{ s.vehicle.title }}</a><span class="text-mute text-sm"> — {{ s.seen_city or '?' }}</span><div class="eyebrow mt-1">{{ (s.notes or '')[:70] }} · {{ s.created_at|ago }}</div></div>
    <div class="flex items-center gap-1.5">
      <span class="tag {{ 'tag-recovered' if s.status=='verified' else 'tag-active' }}"><span class="dot"></span>{{ s.status }}</span>
      <form method="post" action="{{ url_for('admin.moderate_sighting', sighting_id=s.id, action='verified') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-recover btn-sm">Verify</button></form>
      <form method="post" action="{{ url_for('admin.moderate_sighting', sighting_id=s.id, action='dismissed') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-ghost btn-sm">Dismiss</button></form>
    </div>
  </div>
{% else %}<div class="card p-10 text-center text-mute text-sm">No sightings.</div>{% endfor %}
</div>
{% endblock %}
