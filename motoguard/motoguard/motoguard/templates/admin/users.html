{% extends "base.html" %}
{% block content %}
<p class="eyebrow mb-1">Moderation</p>
<h1 class="font-display font-800 text-2xl text-chalk mb-5">Users</h1>
<div class="space-y-2">
{% for u in users %}
  <div class="card p-4">
    <div class="flex justify-between items-center gap-3 flex-wrap">
      <div class="text-sm"><span class="text-chalk font-medium">{{ u.username }}</span> <span class="text-mute">{{ u.email }}</span>
        {% if u.is_admin %}<span class="tag tag-active ml-1" style="color:#F5C518;border-color:rgba(245,197,24,.4)">admin</span>{% endif %}
        {% if u.is_banned %}<span class="tag tag-stolen ml-1"><span class="dot"></span>banned</span>{% endif %}</div>
      <div class="flex gap-1.5">
        <form method="post" action="{{ url_for('admin.moderate_user', user_id=u.id, action='ban' if not u.is_banned else 'unban') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-ghost btn-sm">{{ 'Ban' if not u.is_banned else 'Unban' }}</button></form>
        <form method="post" action="{{ url_for('admin.moderate_user', user_id=u.id, action='promote' if not u.is_admin else 'demote') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-ghost btn-sm">{{ 'Make admin' if not u.is_admin else 'Demote' }}</button></form>
      </div>
    </div>
    <div class="grid sm:grid-cols-2 gap-2 mt-3 pt-3 border-t border-hair">
      <form method="post" action="{{ url_for('admin.set_user_email', user_id=u.id) }}" class="flex gap-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input name="email" type="email" value="{{ u.email }}" class="input input-sm flex-1" aria-label="Set email">
        <button class="btn btn-ghost btn-sm whitespace-nowrap">Set email</button>
      </form>
      <form method="post" action="{{ url_for('admin.set_user_password', user_id=u.id) }}" class="flex gap-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input name="password" type="text" placeholder="New password (8+)" class="input input-sm flex-1" aria-label="Set password">
        <button class="btn btn-ghost btn-sm whitespace-nowrap">Set password</button>
      </form>
    </div>
  </div>
{% endfor %}
</div>
{% endblock %}
