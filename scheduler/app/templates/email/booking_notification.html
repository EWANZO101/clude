<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#F4F5F7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F4F5F7; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#FFFFFF; border-radius:12px; overflow:hidden; border:1px solid #E4E6EB;">

          <tr>
            <td style="padding:24px 32px; border-bottom:1px solid #E4E6EB;">
              <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background-color:{{ accent_color|default('#E8A33D') }}; margin-right:8px; vertical-align:middle;"></span>
              <span style="font-size:15px; font-weight:600; color:#1A1D24; vertical-align:middle;">{{ app_name }}</span>
            </td>
          </tr>

          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 12px; font-size:20px; font-weight:600; color:#1A1D24;">{{ heading }}</h1>
              <p style="margin:0 0 24px; font-size:14px; line-height:1.6; color:#5A6072;">{{ intro }}</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8F9FB; border-radius:10px; border:1px solid #E4E6EB;">
                <tr>
                  <td style="padding:20px 24px;">
                    <p style="margin:0 0 4px; font-size:15px; font-weight:600; color:#1A1D24;">{{ booking_type_name }}</p>
                    <p style="margin:0; font-size:14px; color:#5A6072; line-height:1.6;">
                      {{ start_display }}<br>
                      {{ time_display }}
                    </p>
                    {% if notes %}
                    <p style="margin:12px 0 0; font-size:13px; color:#8B93A7; font-style:italic;">"{{ notes }}"</p>
                    {% endif %}
                  </td>
                </tr>
              </table>

              {% if cta_url %}
              <p style="margin:24px 0 0; text-align:center;">
                <a href="{{ cta_url }}" style="display:inline-block; background-color:#1A1D24; color:#FFFFFF; text-decoration:none; font-size:14px; font-weight:500; padding:11px 22px; border-radius:8px;">
                  {{ cta_label }}
                </a>
              </p>
              {% endif %}
            </td>
          </tr>

          <tr>
            <td style="padding:20px 32px; border-top:1px solid #E4E6EB;">
              <p style="margin:0; font-size:12px; color:#9CA2AF;">Sent by {{ app_name }} — a self-hosted scheduling tool.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
