{% extends "base.html" %}
{% block title %}Not found · {{ app_name }}{% endblock %}
{% block body %}
<div class="flex min-h-screen flex-col items-center justify-center text-center px-4">
  <p class="font-display text-6xl font-semibold text-ink-faint">404</p>
  <h1 class="mt-3 font-display text-xl font-semibold text-ink">Page not found</h1>
  <p class="mt-2 max-w-sm text-sm text-ink-muted">The page you're looking for doesn't exist or may have moved.</p>
  <a href="{{ url_for('admin.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn-primary mt-6">Back to safety</a>
</div>
{% endblock %}
