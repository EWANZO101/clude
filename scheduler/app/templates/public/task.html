{% extends "base.html" %}
{% block title %}Currently · {{ app_name }}{% endblock %}
{% block body %}
<div class="flex min-h-screen flex-col items-center justify-center px-6 text-center">
  {% if current_task %}
    <p class="text-xs font-medium uppercase tracking-wide text-ink-faint">Currently</p>
    <p class="mt-3 max-w-md font-display text-xl font-medium text-ink sm:text-2xl">{{ current_task }}</p>
  {% else %}
    <p class="text-sm text-ink-faint">Nothing set right now.</p>
  {% endif %}
</div>
{% endblock %}
