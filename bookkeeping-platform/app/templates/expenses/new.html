{% extends "base.html" %}
{% block title %}New expense{% endblock %}
{% block content %}
<h1 class="page-title mb-6">New expense</h1>
<form id="expense-form" method="POST" class="card card-padded space-y-4 max-w-lg">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <p class="text-muted text-xs">This form works offline — if you lose connection it queues locally and syncs automatically once you're back online.</p>
  <div><label class="label-field">Description</label><input name="description" required class="input-field w-full"></div>
  <div><label class="label-field">Amount</label><input name="amount" required class="input-field w-full"></div>
  <div><label class="label-field">Date</label><input type="date" name="expense_date" class="input-field w-full"></div>
  <div><label class="label-field">Supplier (optional)</label>
    <select name="supplier_id" class="input-field w-full">
      <option value="">—</option>
      {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
    </select>
  </div>
  <div><label class="label-field">Expense category (account)</label>
    <select name="expense_account_id" required class="input-field w-full">
      {% for a in expense_accounts %}<option value="{{ a.id }}">{{ a.code }} {{ a.name }}</option>{% endfor %}
    </select>
  </div>
  <div><label class="label-field">Paid from</label>
    <select name="paid_from_account_id" required class="input-field w-full">
      {% for a in asset_accounts %}<option value="{{ a.id }}">{{ a.code }} {{ a.name }}</option>{% endfor %}
    </select>
  </div>
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="is_reimbursable"> Reimbursable</label>
  <button class="btn btn-primary">Save expense</button>
</form>
{% endblock %}
