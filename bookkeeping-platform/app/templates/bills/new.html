{% extends "base.html" %}
{% block title %}New bill{% endblock %}
{% block content %}
<h1 class="page-title mb-6">New bill</h1>
<form method="POST" class="card card-padded space-y-4 max-w-2xl">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="grid sm:grid-cols-3 gap-4">
    <div><label class="label-field">Supplier</label>
      <select name="supplier_id" required class="input-field w-full">
        {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div><label class="label-field">Bill number</label><input name="bill_number" class="input-field w-full"></div>
    <div><label class="label-field">Issue date</label><input type="date" name="issue_date" class="input-field w-full"></div>
  </div>
  <div><label class="label-field">Due date</label><input type="date" name="due_date" class="input-field w-full"></div>

  <div class="space-y-2">
    <div class="text-sm font-medium">Line items</div>
    {% for i in range(3) %}
    <div class="grid grid-cols-3 gap-2">
      <input name="line_description" placeholder="Description" class="input-field">
      <input name="line_amount" placeholder="Amount" class="input-field">
      <select name="line_account_id" class="input-field">
        {% for a in expense_accounts %}<option value="{{ a.id }}">{{ a.code }} {{ a.name }}</option>{% endfor %}
      </select>
    </div>
    {% endfor %}
  </div>

  <button class="btn btn-primary">Save as draft</button>
</form>
{% endblock %}
