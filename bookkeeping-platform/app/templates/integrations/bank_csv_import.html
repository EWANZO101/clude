{% extends "base.html" %}
{% block title %}Import bank statement{% endblock %}
{% block content %}
<h1 class="page-title mb-6">Import bank statement (CSV)</h1>
<form method="POST" enctype="multipart/form-data" class="card card-padded space-y-4 max-w-lg">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div><label class="label-field">Bank/cash account</label>
    <select name="bank_account_id" required class="input-field w-full">
      {% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} {{ a.name }}</option>{% endfor %}
    </select>
  </div>
  <div><label class="label-field">CSV file</label><input type="file" name="file" accept=".csv" required class="w-full text-sm"></div>
  <p class="text-muted text-xs">Expected columns: <code>date</code> (YYYY-MM-DD), <code>description</code>, <code>amount</code> (positive = money in, negative = money out).</p>
  <button class="btn btn-primary">Import</button>
</form>
{% endblock %}
