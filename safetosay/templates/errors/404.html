{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div style="text-align:center;padding:4rem 1rem">
  <div style="font-family:'IBM Plex Mono',monospace;font-size:5rem;font-weight:700;color:rgba(88,166,255,.2);line-height:1">404</div>
  <h1 style="font-size:1.5rem;font-weight:700;margin:.75rem 0 .5rem">Page Not Found</h1>
  <p style="color:var(--muted)">This post or page doesn't exist, or has been removed.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary" style="margin-top:1.5rem">← Back to Home</a>
</div>
{% endblock %}
