<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Blocked</title>
<style>
  body{background:#0d1117;color:#e6edf3;font-family:'IBM Plex Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:1rem}
  .box{text-align:center;max-width:480px}
  .code{font-size:4rem;font-weight:700;color:rgba(248,81,73,.4);font-family:monospace;line-height:1}
  h1{font-size:1.4rem;margin:.6rem 0 .4rem}
  p{color:#8b949e;font-size:.9rem;line-height:1.6}
  .ref{margin-top:1.5rem;padding:.75rem 1rem;background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.2);border-radius:8px;font-size:.85rem;color:#f85149}
</style>
</head>
<body>
<div class="box">
  <div class="code">403</div>
  <h1>Access Blocked</h1>
  <p>Your IP address has been blocked from accessing this platform. If you believe this is an error, please contact the site administrator.</p>
  <div class="ref">Your access has been restricted due to a violation of our community rules.</div>
</div>
</body>
</html>
