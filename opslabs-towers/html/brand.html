<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pole plate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 512px; height: 704px; overflow: hidden; background: #f4f4f2; font-family: Arial, Helvetica, sans-serif; color: #111; }
  .band { height: 170px; display: flex; align-items: center; justify-content: center; padding: 0 28px; color: #fff; text-align: center; }
  .name { font-size: 64px; font-weight: 900; letter-spacing: 1px; line-height: 1; white-space: nowrap; }
  .body { padding: 34px 32px; text-align: center; }
  .number { font-size: 70px; font-weight: 900; letter-spacing: 2px; white-space: nowrap; }
  .rule { height: 6px; margin: 26px 50px; border-radius: 3px; }
  .phone { font-size: 40px; font-weight: 800; white-space: nowrap; }
  .extra { font-size: 30px; font-weight: 700; margin-top: 22px; color: #333; white-space: nowrap; }
  .foot { position: absolute; bottom: 0; left: 0; right: 0; height: 26px; }
</style>
</head>
<body>
<div class="band" id="band"><div class="name" id="name"></div></div>
<div class="body">
  <div class="number" id="number"></div>
  <div class="rule" id="rule"></div>
  <div class="phone" id="phone"></div>
  <div class="extra" id="extra"></div>
</div>
<div class="foot" id="foot"></div>
<script>
  const q = new URLSearchParams(location.search);
  const color = /^#[0-9a-f]{6}$/i.test(q.get('color') || '') ? q.get('color') : '#0a84ff';
  for (const id of ['band', 'rule', 'foot']) document.getElementById(id).style.background = color;
  document.getElementById('name').textContent = q.get('name') || 'OPS Openline';
  document.getElementById('number').textContent = q.get('number') || '';
  document.getElementById('phone').textContent = q.get('phone') || '';
  document.getElementById('extra').textContent = q.get('extra') || '';
  for (const id of ['name', 'number', 'phone', 'extra']) {
    const el = document.getElementById(id);
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > 456 && size > 14) { size -= 2; el.style.fontSize = size + 'px'; }
  }
</script>
</body>
</html>
