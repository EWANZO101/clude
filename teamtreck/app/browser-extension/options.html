<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TeamTreck URL Tracker - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 420px;
      margin: 24px auto;
      color: #1f2937;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    p.hint { color: #6b7280; font-size: 13px; margin-top: 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 4px; }
    input {
      width: 100%; padding: 8px 10px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 14px; box-sizing: border-box;
    }
    button {
      margin-top: 20px; width: 100%; padding: 10px; border: none;
      border-radius: 8px; background: #4f46e5; color: white;
      font-weight: 600; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #4338ca; }
    #status { margin-top: 12px; font-size: 13px; text-align: center; min-height: 18px; }
  </style>
</head>
<body>
  <h1>TeamTreck URL Tracker</h1>
  <p class="hint">Reports website time to your TeamTreck server, only while a timer is running. Private/incognito windows are never tracked.</p>

  <label for="serverUrl">TeamTreck Server URL</label>
  <input id="serverUrl" type="text" placeholder="https://your-teamtreck-server.com">

  <label for="apiToken">Agent Token</label>
  <input id="apiToken" type="text" placeholder="Get this from the Monitoring page in TeamTreck">

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
