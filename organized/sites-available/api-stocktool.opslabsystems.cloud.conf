# NOTE: this domain previously had two near-identical files (api-stocktool.conf, and
# an api block inside stocktool.conf), both proxying to 127.0.0.1:5032. Merged here,
# keeping the extra tuning (proxy_buffering off + long read_timeout, useful for slow
# stock-data responses) that only appeared in the stocktool.conf copy.

server {
    listen 80;
    listen [::]:80;

    server_name api-stocktool.opslabsystems.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name api-stocktool.opslabsystems.cloud;

    ssl_certificate /etc/letsencrypt/live/api-stocktool.opslabsystems.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-stocktool.opslabsystems.cloud/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5032;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
