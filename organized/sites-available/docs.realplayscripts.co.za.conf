server {
    server_name docs.realplayscripts.co.za;
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/docs.realplayscripts.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.realplayscripts.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = docs.realplayscripts.co.za) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name docs.realplayscripts.co.za;
    return 404;
}
