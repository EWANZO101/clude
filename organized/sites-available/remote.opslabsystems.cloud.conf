server {
    server_name remote.opslabsystems.cloud;

    location / {
        proxy_pass http://127.0.0.1:5092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # kiosk long-poll (~25s) and proxied requests (~20s) both need
        # real headroom, or nginx cuts them off early.
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/remote.opslabsystems.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/remote.opslabsystems.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = remote.opslabsystems.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name remote.opslabsystems.cloud;
    return 404; # managed by Certbot


}