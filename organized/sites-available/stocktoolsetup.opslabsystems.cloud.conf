# NOTE: this domain previously had two files (stocktoolsetup, stocktoolsetup.opslabsystems.cloud.conf)
# both proxying to the same backend (127.0.0.1:5090) with no real conflict, just different
# upload-size/timeout tuning. Merged here, keeping the larger 2G upload limit and the
# extended timeouts + disabled request buffering (needed for big release uploads) from the
# more complete of the two, plus http2 from the other.

server {
    listen 80;
    server_name stocktoolsetup.opslabsystems.cloud;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2; # managed by Certbot
    server_name stocktoolsetup.opslabsystems.cloud;

    ssl_certificate /etc/letsencrypt/live/stocktoolsetup.opslabsystems.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stocktoolsetup.opslabsystems.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large release uploads
    client_max_body_size 2G;

    location / {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support long uploads
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for large uploads
        proxy_request_buffering off;
    }
}
