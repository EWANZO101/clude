# NOTE: this domain previously had two files (linkshare, linkshare.opslabsystems.cloud)
# with identical proxy_pass/backend (127.0.0.1:5004). The other file was the pre-SSL
# original left behind after Certbot generated this one. Safe to drop; nothing lost.

server {
    server_name linkshare.opslabsystems.cloud;

    client_max_body_size 520M;

    location / {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static/ {
        alias /root/linkshare/static/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/linkshare.opslabsystems.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/linkshare.opslabsystems.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = linkshare.opslabsystems.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name linkshare.opslabsystems.cloud;
    return 404; # managed by Certbot
}
