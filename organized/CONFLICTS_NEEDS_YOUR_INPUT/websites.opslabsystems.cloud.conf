# ============================================================================
# CONFLICT — needs your confirmation before this goes live.
# ============================================================================
# "websites.opslabsystems.cloud" was defined two conflicting ways:
#
#   1) opslab-websites.conf — plain HTTP only (port 80), proxies to
#      127.0.0.1:5801.
#   2) websites.opslabsystems.cloud.conf — HTTPS, proxies to 127.0.0.1:8000
#      (the same backend port as the stocktool admin frontend).
#
# Two problems here, not one:
#   a) Different backend ports (5801 vs 8000) — confirm which is current.
#   b) BUG in the original file: its ssl_certificate paths pointed at
#      /etc/letsencrypt/live/web.opslabsystems.cloud/... — i.e. it was using
#      WEB's certificate, not its own. That works in nginx (a cert is valid
#      for whatever hostnames are in its SAN list, and if web's cert doesn't
#      list "websites.opslabsystems.cloud" browsers will show a certificate
#      warning). I've pointed it at its own domain below — PLEASE CONFIRM a
#      cert actually exists at /etc/letsencrypt/live/websites.opslabsystems.cloud/
#      (run `certbot certificates` on the server) before using this, or run
#      certbot for this domain if it doesn't exist yet.
#
# Option (2), with the cert path fixed, is ACTIVE below. Option (1) is
# commented out.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name websites.opslabsystems.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name websites.opslabsystems.cloud;

    # TODO: confirm this cert exists — original file mistakenly pointed to
    # web.opslabsystems.cloud's certificate instead of its own.
    ssl_certificate /etc/letsencrypt/live/websites.opslabsystems.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websites.opslabsystems.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

