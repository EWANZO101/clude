# ============================================================================
# CONFLICT — needs your confirmation before this goes live.
# ============================================================================
# "web.opslabsystems.cloud" was defined two conflicting ways:
#
#   1) opslab-web.conf — plain HTTP only (port 80), proxies to 127.0.0.1:5800.
#   2) web.opslabsystems.cloud.conf — HTTPS (Certbot-managed), proxies to
#      127.0.0.1:5041, with a port-80 block that redirects to https instead
#      of proxying directly.
#
# Different backend ports (5800 vs 5041) — these are not just formatting
# differences, they're two different apps/processes. I've made option (2)
# ACTIVE below since it's the one with SSL. Option (1) is commented out.
# PLEASE CONFIRM which backend (5800 or 5041) is actually the current app
# before deploying — an out-of-date choice here will serve the wrong site.
# Also note: several other subdomains (opslabsystems.cloud bare-domain,
# stocktool admin, websites) all redirect users TO web.opslabsystems.cloud,
# so this one is high-traffic — get it right before removing the losing side.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name web.opslabsystems.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl; # managed by Certbot
    server_name web.opslabsystems.cloud;

    location / {
        proxy_pass http://127.0.0.1:5041;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/web.opslabsystems.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/web.opslabsystems.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

