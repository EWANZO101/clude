# ============================================================================
# CONFLICT — needs your confirmation before this goes live.
# ============================================================================
# The domain "stocktool.opslabsystems.cloud" was defined THREE different, mutually
# exclusive ways across your backup. Nginx can only run one server_name per port —
# it would have picked whichever loaded last and silently ignored the rest.
#
#   1) Inside "default" — a broken leftover. Certbot appears to have been run
#      against the stock nginx default file instead of a dedicated site file,
#      leaving a block that just serves static files from /var/www/html and
#      does no proxying at all. This is almost certainly a mistake, not a real
#      backend. I've dropped it.
#
#   2) Inside "stocktool.conf", labeled "Admin frontend" — HTTPS (443, http2),
#      proxies to 127.0.0.1:8000, with X-Forwarded-Host and a 3600s read
#      timeout. This looks like the current, deliberately-tuned config.
#
#   3) "stocktool.opslabsystems.cloud.conf" — plain HTTP only (port 80, no
#      SSL), proxies to 127.0.0.1:5035 — the exact same backend port as
#      client-stock.opslabsystems.cloud. This looks like a stale leftover from
#      before the service was renamed/moved to the client-stock subdomain.
#
# I've made option (2) ACTIVE below since it's the SSL-terminated, more complete
# config. Option (3) is included commented-out beneath it. PLEASE CONFIRM:
#   - Is stocktool.opslabsystems.cloud still supposed to serve the app on :8000?
#   - Is the old :5035 config (option 3) safe to delete, given client-stock.
#     opslabsystems.cloud already proxies to that same port?
# Once confirmed, move this file into sites-available/ and drop this banner.
# ============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name stocktool.opslabsystems.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name stocktool.opslabsystems.cloud;

    ssl_certificate /etc/letsencrypt/live/stocktool.opslabsystems.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stocktool.opslabsystems.cloud/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600;
    }
}

