{% extends "admin/base_admin.html" %}
{% block title %}Player Monitor{% endblock %}

{% block admin_content %}
<style>
  /* ── Layout ── */
  .monitor-wrap {
    display: flex;
    gap: 1rem;
    height: calc(100vh - 100px);
    min-height: 500px;
  }

  /* ── Feed grid ── */
  .feed-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .feed-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .feed-grid {
    flex: 1;
    display: grid;
    gap: 0.5rem;
    overflow: hidden;
  }

  /* Grid sizes */
  .feed-grid.grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .feed-grid.grid-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .feed-grid.grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .feed-grid.grid-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }
  .feed-grid.grid-9 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .feed-grid.grid-16 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }

  /* ── Feed cell ── */
  .feed-cell {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .feed-cell:hover { border-color: var(--accent); }

  .feed-cell.empty {
    border-style: dashed;
    opacity: 0.4;
  }

  .feed-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .feed-cell .empty-icon {
    color: var(--text-subtle);
    font-size: 2rem;
  }

  /* Player name bar */
  .feed-name {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    padding: 1.5rem 0.5rem 0.4rem;
    font-size: 0.7rem;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* LIVE badge */
  .live-badge {
    background: var(--red);
    color: #fff;
    font-size: 0.55rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 2px 5px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .live-dot {
    width: 5px;
    height: 5px;
    background: #fff;
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  /* Close button on cell */
  .feed-close {
    position: absolute;
    top: 0.35rem;
    right: 0.35rem;
    background: rgba(0,0,0,0.6);
    border: none;
    color: #fff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 0.65rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .feed-cell:hover .feed-close { opacity: 1; }

  /* Stale overlay */
  .stale-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--yellow);
    gap: 0.4rem;
    display: none;
  }

  .feed-cell.stale .stale-overlay { display: flex; }

  /* Age timer */
  .feed-age {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.5);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Right panel ── */
  .player-panel {
    width: 240px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .player-panel-header {
    padding: 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .player-panel-header input {
    flex: 1;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    padding: 0.3rem 0.5rem;
    font-size: 0.75rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .player-panel-header input:focus { border-color: var(--accent); }

  .player-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.4rem;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 0.5rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 0.75rem;
  }

  .player-row:hover { background: var(--surface-3); }

  .player-row.active { background: var(--accent-dim); }

  .player-row input[type=checkbox] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  .player-row .pid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-subtle);
    margin-left: auto;
    white-space: nowrap;
  }

  .player-panel-footer {
    padding: 0.6rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 0.4rem;
  }

  /* ── Toolbar ── */
  .monitor-toolbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .btn-sm {
    padding: 0.3rem 0.65rem;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-sm:hover { opacity: 0.8; }

  .btn-accent { background: var(--accent); color: #fff; }
  .btn-surface { background: var(--surface-3); color: var(--text-primary); border: 1px solid var(--border); }
  .btn-danger  { background: var(--red); color: #fff; }

  select.btn-sm {
    background: var(--surface-3);
    color: var(--text-primary);
    border: 1px solid var(--border);
    appearance: none;
    padding-right: 1rem;
  }

  /* No players message */
  .no-players {
    padding: 1rem;
    text-align: center;
    color: var(--text-subtle);
    font-size: 0.75rem;
  }

  /* ── Fullscreen lightbox ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.75rem;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 95vw;
    max-height: 85vh;
    border-radius: 8px;
    object-fit: contain;
  }

  .lightbox-name {
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .lightbox-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: var(--surface-3);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 0.4rem 0.75rem;
    cursor: pointer;
    font-size: 0.8rem;
  }

  /* Scrollbar in player list */
  .player-list::-webkit-scrollbar { width: 4px; }
  .player-list::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 2px; }
</style>

<!-- Page header -->
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
  <div>
    <h1 style="font-size:1.25rem;font-weight:700;margin:0;">
      <i class="ti ti-device-desktop-analytics" style="color:var(--accent);margin-right:0.4rem;"></i>
      Player Monitor
    </h1>
    <p style="color:var(--text-subtle);font-size:0.75rem;margin:0.2rem 0 0;">
      Live screen captures from connected players
    </p>
  </div>

  <div class="monitor-toolbar">
    <span style="font-size:0.72rem;color:var(--text-muted);">Grid:</span>
    <select class="btn-sm" id="gridSelect" onchange="setGrid(this.value)">
      <option value="1">1×1</option>
      <option value="2">2×1</option>
      <option value="4" selected>2×2</option>
      <option value="6">3×2</option>
      <option value="9">3×3</option>
      <option value="16">4×4</option>
    </select>

    <button class="btn-sm btn-surface" onclick="clearAll()">
      <i class="ti ti-x"></i> Clear All
    </button>
  </div>
</div>

<!-- Main layout -->
<div class="monitor-wrap">

  <!-- Feed grid -->
  <div class="feed-area">
    <div class="feed-grid grid-4" id="feedGrid">
      <!-- Cells rendered by JS -->
    </div>
  </div>

  <!-- Right panel -->
  <div class="player-panel">
    <div class="player-panel-header">
      <input type="text" id="playerSearch" placeholder="Search players…" oninput="renderPlayerList()">
      <button class="btn-sm btn-surface" onclick="refreshPlayers()" title="Refresh">
        <i class="ti ti-refresh"></i>
      </button>
    </div>

    <div class="player-list" id="playerList">
      <div class="no-players">Loading players…</div>
    </div>

    <div class="player-panel-footer">
      <button class="btn-sm btn-accent" style="flex:1;" onclick="addAll()">Add All</button>
      <button class="btn-sm btn-surface" style="flex:1;" onclick="clearAll()">Clear</button>
    </div>
  </div>
</div>

<!-- Fullscreen lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()"><i class="ti ti-x"></i> Close</button>
  <div class="lightbox-name" id="lightboxName"></div>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
// ──────────────────────────────────────────────
// State
// ──────────────────────────────────────────────
let gridSize   = 4;           // number of cells
let slots      = [];          // array of { server_id, name } | null
let allPlayers = [];          // latest /api/monitor/latest results
let pollingTimer = null;

// ──────────────────────────────────────────────
// Grid setup
// ──────────────────────────────────────────────
function setGrid(n) {
  gridSize = parseInt(n);
  // Trim slots if needed
  slots = slots.slice(0, gridSize);
  while (slots.length < gridSize) slots.push(null);
  renderGrid();
}

function initGrid() {
  slots = Array(gridSize).fill(null);
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('feedGrid');
  grid.className = 'feed-grid grid-' + gridSize;

  // Remove extra cells
  while (grid.children.length > gridSize) {
    grid.removeChild(grid.lastChild);
  }

  // Add/update cells
  for (let i = 0; i < gridSize; i++) {
    let cell = grid.children[i];
    if (!cell) {
      cell = document.createElement('div');
      cell.className = 'feed-cell empty';
      cell.innerHTML = `<i class="ti ti-user-off empty-icon"></i>`;
      cell.dataset.slot = i;
      cell.addEventListener('click', () => onCellClick(i));
      grid.appendChild(cell);
    }
    updateCell(cell, i);
  }
}

function updateCell(cell, i) {
  const player = slots[i];

  if (!player) {
    cell.className = 'feed-cell empty';
    cell.innerHTML = `<i class="ti ti-user-off empty-icon"></i>`;
    cell.dataset.slot = i;
    cell.addEventListener('click', () => onCellClick(i));
    return;
  }

  const ts = Date.now();
  const imgSrc = `/api/monitor/frame/${player.server_id}?t=${ts}`;

  cell.className = 'feed-cell';
  cell.dataset.slot = i;
  cell.innerHTML = `
    <img id="frame-${i}" src="${imgSrc}" alt="${player.name}"
         onerror="this.parentElement.classList.add('stale')"
         onload="this.parentElement.classList.remove('stale')">
    <div class="stale-overlay"><i class="ti ti-wifi-off"></i> No signal</div>
    <div class="feed-name">
      <span>${player.name} <span class="feed-age" id="age-${i}"></span></span>
      <span class="live-badge"><span class="live-dot"></span> LIVE</span>
    </div>
    <button class="feed-close" onclick="removeFromSlot(event, ${i})">
      <i class="ti ti-x"></i>
    </button>
  `;
  cell.addEventListener('click', () => onCellClick(i));
}

function onCellClick(i) {
  const player = slots[i];
  if (!player) return;
  openLightbox(player);
}

function removeFromSlot(e, i) {
  e.stopPropagation();
  slots[i] = null;
  const cell = document.getElementById('feedGrid').children[i];
  updateCell(cell, i);
  renderPlayerList();
}

function clearAll() {
  slots = Array(gridSize).fill(null);
  renderGrid();
  renderPlayerList();
}

function addAll() {
  allPlayers.forEach(p => addPlayer(p.id, p.name));
}

function addPlayer(server_id, name) {
  // Already in a slot?
  if (slots.some(s => s && s.server_id === server_id)) return;
  // Find empty slot
  const emptyIdx = slots.findIndex(s => s === null);
  if (emptyIdx === -1) return; // grid full
  slots[emptyIdx] = { server_id, name };
  const cell = document.getElementById('feedGrid').children[emptyIdx];
  updateCell(cell, emptyIdx);
  renderPlayerList();
}

// ──────────────────────────────────────────────
// Frame refresh loop
// ──────────────────────────────────────────────
function refreshFrames() {
  for (let i = 0; i < gridSize; i++) {
    const player = slots[i];
    if (!player) continue;

    const img = document.getElementById(`frame-${i}`);
    if (!img) continue;

    const newSrc = `/api/monitor/frame/${player.server_id}?t=${Date.now()}`;
    img.src = newSrc;
  }
}

// ──────────────────────────────────────────────
// Player list polling
// ──────────────────────────────────────────────
async function refreshPlayers() {
  try {
    const res = await fetch('/api/monitor/latest');
    if (!res.ok) return;
    allPlayers = await res.json();
    renderPlayerList();
  } catch(e) {}
}

function renderPlayerList() {
  const list   = document.getElementById('playerList');
  const search = document.getElementById('playerSearch').value.toLowerCase();

  const filtered = allPlayers.filter(p =>
    p.name.toLowerCase().includes(search) ||
    String(p.id).includes(search)
  );

  if (filtered.length === 0) {
    list.innerHTML = `<div class="no-players">${
      allPlayers.length === 0 ? 'No players online' : 'No results'
    }</div>`;
    return;
  }

  list.innerHTML = filtered.map(p => {
    const inSlot = slots.some(s => s && s.server_id === p.id);
    return `
      <div class="player-row ${inSlot ? 'active' : ''}"
           onclick="togglePlayer('${p.id}', '${escapeHtml(p.name)}')">
        <input type="checkbox" ${inSlot ? 'checked' : ''}
               onclick="event.stopPropagation();togglePlayer('${p.id}', '${escapeHtml(p.name)}')">
        <span>${escapeHtml(p.name)}</span>
        <span class="pid">#${p.id}</span>
      </div>
    `;
  }).join('');
}

function togglePlayer(server_id, name) {
  const idx = slots.findIndex(s => s && s.server_id === server_id);
  if (idx !== -1) {
    removeFromSlot({ stopPropagation: () => {} }, idx);
  } else {
    addPlayer(server_id, name);
  }
}

// ──────────────────────────────────────────────
// Lightbox
// ──────────────────────────────────────────────
let lightboxPlayer = null;
let lightboxTimer  = null;

function openLightbox(player) {
  lightboxPlayer = player;
  document.getElementById('lightboxName').textContent = player.name;
  document.getElementById('lightboxImg').src = `/api/monitor/frame/${player.server_id}?t=${Date.now()}`;
  document.getElementById('lightbox').classList.add('open');

  lightboxTimer = setInterval(() => {
    if (lightboxPlayer) {
      document.getElementById('lightboxImg').src =
        `/api/monitor/frame/${lightboxPlayer.server_id}?t=${Date.now()}`;
    }
  }, 2000);
}

function closeLightbox() {
  lightboxPlayer = null;
  clearInterval(lightboxTimer);
  document.getElementById('lightbox').classList.remove('open');
}

// ──────────────────────────────────────────────
// Utils
// ──────────────────────────────────────────────
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ──────────────────────────────────────────────
// Boot
// ──────────────────────────────────────────────
initGrid();
refreshPlayers();

// Poll player list every 3s
setInterval(refreshPlayers, 3000);

// Refresh frames at the same rate as FiveM sends them
setInterval(refreshFrames, 2000);

// Close lightbox on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
{% endblock %}
