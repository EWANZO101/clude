{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 61px);display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:420px;">

    <!-- Logo -->
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:52px;height:52px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.3rem;font-weight:900;color:#fff;">CF</div>
      <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.375rem;">Welcome back</h1>
      <p style="color:var(--text-muted);font-size:0.9rem;">Sign in to your {{ site.site_name }} account</p>
    </div>

    <div class="card" style="padding:2rem;">
      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}"/>

        <div style="margin-bottom:1.25rem;">
          <label class="form-label" for="identifier">Username or Email</label>
          <input type="text" id="identifier" name="identifier" class="form-input"
                 placeholder="yourname or you@example.com" required autofocus
                 value="{{ request.form.get('identifier', '') }}" />
        </div>

        <div style="margin-bottom:1.5rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.375rem;">
            <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
          </div>
          <div style="position:relative;">
            <input type="password" id="password" name="password" class="form-input"
                   placeholder="••••••••" required />
            <button type="button" onclick="togglePw()" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);">
              <i class="ti ti-eye" id="pw-icon"></i>
            </button>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
          <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.875rem;color:var(--text-muted);">
            <input type="checkbox" name="remember" style="accent-color:var(--accent);" /> Remember me
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.75rem;">
          <i class="ti ti-login"></i> Sign In
        </button>
      </form>

      <div style="display:flex;align-items:center;gap:1rem;margin:1.25rem 0;">
        <div style="flex:1;height:1px;background:var(--border);"></div>
        <span style="font-size:0.68rem;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.08em;">or</span>
        <div style="flex:1;height:1px;background:var(--border);"></div>
      </div>

      <a href="{{ url_for('auth.register_discord') }}"
         style="display:flex;align-items:center;justify-content:center;gap:0.625rem;width:100%;padding:0.6rem;background:#5865F2;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:0.82rem;transition:opacity 0.15s;"
         onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
        <svg width="18" height="18" viewBox="0 0 71 55" fill="currentColor" style="flex-shrink:0;">
          <path d="M60.1 4.9A58.5 58.5 0 0 0 45.5.4a.2.2 0 0 0-.2.1 40.8 40.8 0 0 0-1.8 3.7 54 54 0 0 0-16.2 0 37.4 37.4 0 0 0-1.9-3.7.2.2 0 0 0-.2-.1A58.4 58.4 0 0 0 10.6 4.9a.2.2 0 0 0-.1.1C1.6 18.3-.9 31.3.3 44.1a.2.2 0 0 0 .1.2A58.8 58.8 0 0 0 18.1 54a.2.2 0 0 0 .2-.1 42 42 0 0 0 3.6-5.9.2.2 0 0 0-.1-.3 38.7 38.7 0 0 1-5.5-2.6.2.2 0 0 1 0-.4l1.1-.8a.2.2 0 0 1 .2 0c11.5 5.2 23.9 5.2 35.3 0a.2.2 0 0 1 .2 0l1.1.8a.2.2 0 0 1 0 .4 36.2 36.2 0 0 1-5.5 2.6.2.2 0 0 0-.1.3 47.1 47.1 0 0 0 3.6 5.9.2.2 0 0 0 .2.1 58.6 58.6 0 0 0 17.7-9.7.2.2 0 0 0 .1-.2c1.5-15-2.5-28-10.4-39.2a.2.2 0 0 0-.1-.1z"/>
        </svg>
        Continue with Discord
      </a>

    </div>

    <p style="text-align:center;margin-top:1.25rem;font-size:0.875rem;color:var(--text-muted);">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" style="color:var(--accent);font-weight:600;text-decoration:none;">Create one</a>
    </p>

  </div>
</div>

<script>
  function togglePw() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.className = 'ti ti-eye-off';
    } else {
      pw.type = 'password';
      icon.className = 'ti ti-eye';
    }
  }
</script>
{% endblock %}
