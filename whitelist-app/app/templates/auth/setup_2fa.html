{% extends "base.html" %}
{% block title %}Set Up Two-Factor Authentication{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 61px);display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:440px;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:52px;height:52px;background:var(--accent-dim);border:1px solid var(--border-strong);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;color:var(--accent);">
        <i class="ti ti-shield-check"></i>
      </div>
      <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.375rem;">Set Up 2FA</h1>
      <p style="color:var(--text-muted);font-size:0.875rem;">Scan the QR code with Google Authenticator, Authy, or similar.</p>
    </div>

    <div class="card" style="padding:2rem;">
      <div style="text-align:center;margin-bottom:1.5rem;">
        {% if qr_code %}
          <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" style="border-radius:12px;width:180px;height:180px;border:4px solid var(--surface-4);" />
        {% endif %}
      </div>

      <div style="margin-bottom:1.25rem;">
        <div class="form-label">Manual Entry Key</div>
        <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:0.75rem;font-family:'JetBrains Mono',monospace;font-size:0.875rem;letter-spacing:0.1em;word-break:break-all;text-align:center;cursor:pointer;" onclick="navigator.clipboard.writeText('{{ secret }}');showToast('Copied!','success')">
          {{ secret }}
        </div>
      </div>

      <form method="POST">
        <label class="form-label" for="code">Enter 6-Digit Code to Verify</label>
        <input type="text" id="code" name="code" class="form-input" placeholder="000000"
               maxlength="8" autocomplete="one-time-code" autofocus required
               style="text-align:center;font-size:1.5rem;font-family:'JetBrains Mono',monospace;letter-spacing:0.2em;margin-bottom:1rem;" />
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
          <i class="ti ti-shield-check"></i> Verify & Enable 2FA
        </button>
      </form>
    </div>

    <p style="text-align:center;margin-top:1.25rem;">
      <a href="{{ url_for('profile.settings') }}" style="color:var(--text-muted);font-size:0.875rem;text-decoration:none;">
        <i class="ti ti-arrow-left"></i> Cancel
      </a>
    </p>
  </div>
</div>
{% endblock %}
