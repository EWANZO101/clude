{% extends "base.html" %}
{% block title %}Backup Codes{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 61px);display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:440px;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:52px;height:52px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;color:var(--green);">
        <i class="ti ti-circle-check"></i>
      </div>
      <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.375rem;">2FA Enabled!</h1>
      <p style="color:var(--text-muted);font-size:0.875rem;">Save these backup codes in a safe place. Each can only be used once.</p>
    </div>

    <div class="card" style="padding:2rem;">
      <div class="flash-message flash-warning" style="margin-bottom:1.25rem;">
        <i class="ti ti-alert-triangle" style="flex-shrink:0;"></i>
        <span>Store these codes securely. They won't be shown again.</span>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:1.5rem;">
        {% for code in codes %}
        <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:0.625rem;font-family:'JetBrains Mono',monospace;font-size:0.875rem;text-align:center;letter-spacing:0.05em;">{{ code }}</div>
        {% endfor %}
      </div>

      <div style="display:flex;gap:0.75rem;">
        <button onclick="copyAll()" class="btn btn-ghost" style="flex:1;justify-content:center;"><i class="ti ti-copy"></i> Copy All</button>
        <a href="{{ url_for('profile.settings') }}" class="btn btn-primary" style="flex:1;justify-content:center;">Done</a>
      </div>
    </div>
  </div>
</div>
<script>
function copyAll() {
  const codes = {{ codes | tojson }};
  navigator.clipboard.writeText(codes.join('\n'));
  showToast('Backup codes copied!', 'success');
}
</script>
{% endblock %}
