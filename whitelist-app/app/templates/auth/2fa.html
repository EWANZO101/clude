{% extends "base.html" %}
{% block title %}Two-Factor Authentication{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 61px);display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:380px;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:52px;height:52px;background:var(--accent-dim);border:1px solid var(--border-strong);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;color:var(--accent);">
        <i class="ti ti-shield-check"></i>
      </div>
      <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.375rem;">Two-Factor Auth</h1>
      <p style="color:var(--text-muted);font-size:0.875rem;">Enter the 6-digit code from your authenticator app</p>
    </div>

    <div class="card" style="padding:2rem;">
      <form method="POST">
        <div style="margin-bottom:1.5rem;">
          <input type="text" name="code" class="form-input" placeholder="000 000"
                 maxlength="8" autocomplete="one-time-code" autofocus
                 style="text-align:center;font-size:1.5rem;font-family:'JetBrains Mono',monospace;letter-spacing:0.2em;" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
          Verify
        </button>
      </form>
      <p style="text-align:center;margin-top:1rem;font-size:0.8rem;color:var(--text-subtle);">
        Lost your device? Use a <a href="#" style="color:var(--accent);">backup code</a>
      </p>
    </div>

    <p style="text-align:center;margin-top:1.25rem;">
      <a href="{{ url_for('auth.login') }}" style="color:var(--text-muted);font-size:0.875rem;text-decoration:none;">
        <i class="ti ti-arrow-left"></i> Back to login
      </a>
    </p>
  </div>
</div>
{% endblock %}
