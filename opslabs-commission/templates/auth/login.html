<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — OpsLabs Commission</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0f11;color:#e8e6f0;font-family:'Crimson Pro',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .bg{position:fixed;inset:0;pointer-events:none}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.1}
    .orb1{width:400px;height:400px;background:#a855f7;top:-100px;right:-100px}
    .orb2{width:300px;height:300px;background:#f59e0b;bottom:-80px;left:-80px}
    .box{position:relative;z-index:1;background:#17171b;border:1px solid #2e2e38;border-radius:16px;padding:2.5rem;width:100%;max-width:400px;animation:fadeIn .5s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .logo{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:700;color:#c084fc;text-align:center;margin-bottom:0.25rem}
    .logo span{color:#f59e0b}
    .sub{text-align:center;color:#5f5d72;font-size:0.9rem;margin-bottom:2rem;font-style:italic}
    label{font-family:'Cinzel',serif;font-size:0.8rem;color:#9694a8;letter-spacing:.05em;display:block;margin-bottom:.35rem}
    input{background:#1e1e24;border:1px solid #2e2e38;color:#e8e6f0;border-radius:8px;padding:.6rem .9rem;font-family:'Crimson Pro',serif;font-size:1rem;width:100%;transition:border-color .2s;margin-bottom:1rem}
    input:focus{outline:none;border-color:#a855f7;box-shadow:0 0 0 3px rgba(192,132,252,.12)}
    button{background:#a855f7;color:#fff;border:none;border-radius:8px;padding:.65rem;width:100%;font-family:'Cinzel',serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:.5rem}
    button:hover{background:#c084fc;box-shadow:0 0 20px rgba(192,132,252,.25)}
    .flash{padding:.7rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.9rem;background:#450a0a22;border:1px solid #7f1d1d;color:#fca5a5}
    a{color:#9694a8;font-size:.85rem;text-decoration:none;display:block;text-align:center;margin-top:1rem}
    a:hover{color:#c084fc}
  </style>
</head>
<body>
  <div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>
  <div class="box">
    <div class="logo">OpsLabs <span>Admin</span></div>
    <p class="sub">Commission Management Panel</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" autocomplete="username" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••••" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
    <a href="/">← Back to site</a>
  </div>
</body>
</html>
