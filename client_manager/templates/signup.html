{% extends "auth_base.html" %}
{% block title %}Sign up · ClientHub{% endblock %}
{% block auth_content %}

<h1 class="text-lg font-bold text-slate-900 dark:text-white mb-1">Create your account</h1>
<p class="text-sm text-slate-500 dark:text-slate-400 mb-5">Set up access to your client workspace.</p>

<form method="post" class="space-y-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div>
    <label class="block text-sm font-medium mb-1">Your name</label>
    <input type="text" name="name" required autofocus value="{{ name }}"
           class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 text-sm">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Email</label>
    <input type="email" name="email" required value="{{ email }}"
           class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 text-sm">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Password</label>
    <input type="password" name="password" required minlength="8"
           class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 text-sm">
    <p class="text-xs text-slate-400 mt-1">At least 8 characters.</p>
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Confirm password</label>
    <input type="password" name="confirm_password" required minlength="8"
           class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 text-sm">
  </div>
  {% if require_code %}
  <div>
    <label class="block text-sm font-medium mb-1">Invite code</label>
    <input type="text" name="signup_code" required
           class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 text-sm">
  </div>
  {% endif %}
  <button type="submit" class="w-full px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Create account</button>
</form>

<p class="text-sm text-slate-500 dark:text-slate-400 mt-5 text-center">
  Already have an account? <a href="{{ url_for('login') }}" class="text-brand-600 hover:underline font-medium">Log in</a>
</p>
{% endblock %}
