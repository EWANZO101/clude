{% extends "auth_base.html" %}
{% block title %}Log in · ClientHub{% endblock %}
{% block auth_content %}

<h1 class="text-lg font-bold text-slate-900 dark:text-white mb-1">Log in</h1>
<p class="text-sm text-slate-500 dark:text-slate-400 mb-5">Welcome back — enter your details below.</p>

<form method="post" class="space-y-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div>
    <label class="block text-sm font-medium mb-1">Email</label>
    <input type="email" name="email" required autofocus value="{{ email }}"
           class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 text-sm">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Password</label>
    <input type="password" name="password" required
           class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 text-sm">
  </div>
  <label class="flex items-center gap-2 text-sm text-slate-500">
    <input type="checkbox" name="remember"> Remember me on this device
  </label>
  <button type="submit" class="w-full px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Log in</button>
</form>

<p class="text-sm text-slate-500 dark:text-slate-400 mt-5 text-center">
  Don't have an account? <a href="{{ url_for('signup') }}" class="text-brand-600 hover:underline font-medium">Sign up</a>
</p>
{% endblock %}
