{% extends "base.html" %}
{% block title %}Log in — OpsLabs Platform{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:2rem auto;">
  <h1>Log in</h1>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Log in</button>
  </form>
  <p style="margin-top:1.25rem;font-size:0.85rem;color:#9aa3af;">
    No account? <a href="{{ url_for('auth.signup') }}" style="color:#8b93ff;">Sign up</a>
  </p>
</div>
{% endblock %}
