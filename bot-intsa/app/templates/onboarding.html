{% extends "base.html" %}
{% block header %}Onboarding{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div id="chat" class="bg-base-900 border border-base-700 rounded-xl p-6 space-y-3 min-h-[320px]"></div>
  <form id="onboarding-form" method="post" action="{{ url_for('onboarding.generate') }}" class="hidden">
    <input type="hidden" name="name">
    <input type="hidden" name="niche">
    <input type="hidden" name="audience">
    <input type="hidden" name="location">
    <input type="hidden" name="goal">
    <input type="hidden" name="style">
  </form>
</div>
<script>
const questions = [
  {key: "name", text: "What's your name or brand?"},
  {key: "niche", text: "What are you trying to build on Instagram?"},
  {key: "audience", text: "Who do you want to attract?"},
  {key: "location", text: "Where are you based?"},
  {key: "goal", text: "What's the main goal? (grow audience, get customers, portfolio, etc.)"},
  {key: "style", text: "What style fits you? (professional, luxury, minimal, edgy, personal, creator)"},
];
let i = 0;
const chat = document.getElementById("chat");
const form = document.getElementById("onboarding-form");

function bubble(text, who) {
  const div = document.createElement("div");
  div.className = who === "ai"
    ? "bg-base-800 text-slate-200 rounded-lg px-4 py-2 max-w-md"
    : "bg-accent-600 text-white rounded-lg px-4 py-2 max-w-md ml-auto";
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function ask() {
  if (i >= questions.length) {
    bubble("Got it. Building your Instagram Blueprint...", "ai");
    form.submit();
    return;
  }
  bubble(questions[i].text, "ai");
  const input = document.createElement("input");
  input.className = "w-full mt-1 bg-base-800 border border-base-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-accent-500";
  input.placeholder = "Type your answer and press Enter";
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && input.value.trim()) {
      form.querySelector(`[name=${questions[i].key}]`).value = input.value.trim();
      bubble(input.value.trim(), "user");
      input.remove();
      i++;
      ask();
    }
  });
  chat.appendChild(input);
  input.focus();
}
ask();
</script>
{% endblock %}
