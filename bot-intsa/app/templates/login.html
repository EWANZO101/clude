<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpsLab — Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            base: { 950: '#0a0b10', 900: '#12131a', 800: '#1b1d27', 700: '#262836' },
            accent: { 500: '#8b5cf6', 600: '#7c3aed' }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-base-950 text-slate-200 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-base-900 border border-base-700 rounded-xl p-6">
    <div class="text-lg font-bold text-white mb-1">OPSLAB</div>
    <p class="text-sm text-slate-500 mb-4">Sign in to continue</p>

    {% if error %}
      <div class="bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm rounded-lg p-3 mb-4">{{ error }}</div>
    {% endif %}

    {% if not locked %}
    <form method="post" class="space-y-3">
      <input name="username" placeholder="Username" autofocus class="w-full bg-base-800 border border-base-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-accent-500">
      <input name="password" type="password" placeholder="Password" class="w-full bg-base-800 border border-base-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-accent-500">
      <button class="w-full px-4 py-2 bg-accent-600 hover:bg-accent-500 rounded-lg text-sm font-medium text-white">Sign in</button>
    </form>
    {% endif %}
  </div>
</body>
</html>
