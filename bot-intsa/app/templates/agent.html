{% extends "base.html" %}
{% block header %}AI Agent{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto flex flex-col h-[70vh]">
  <div id="log" class="flex-1 overflow-y-auto bg-base-900 border border-base-700 rounded-xl p-4 space-y-3 mb-4"></div>
  <form id="chat-form" class="flex gap-2">
    <input id="msg" class="flex-1 bg-base-800 border border-base-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-accent-500" placeholder="Make my Instagram look more professional...">
    <button class="px-4 py-2 bg-accent-600 hover:bg-accent-500 rounded-lg text-sm font-medium text-white">Send</button>
  </form>
</div>
<script>
const log = document.getElementById("log");
const form = document.getElementById("chat-form");
const input = document.getElementById("msg");

function bubble(text, who) {
  const div = document.createElement("div");
  div.className = who === "ai"
    ? "bg-base-800 text-slate-200 rounded-lg px-4 py-2 max-w-md"
    : "bg-accent-600 text-white rounded-lg px-4 py-2 max-w-md ml-auto";
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble(text, "user");
  input.value = "";
  const res = await fetch("{{ url_for('agent.message') }}", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: text})
  });
  const data = await res.json();
  bubble(data.reply, "ai");
});
</script>
{% endblock %}
