{% extends "base.html" %}
{% block header %}Content / #{{ post.id }}{% endblock %}
{% block content %}
<div class="max-w-2xl bg-base-900 border border-base-700 rounded-xl p-6 space-y-4">
  <div class="text-xs uppercase tracking-wide text-slate-500">{{ post.kind }}</div>
  <form method="post" action="{{ url_for('content.edit', post_id=post.id) }}" class="space-y-3">
    <label class="text-sm text-slate-400">Caption</label>
    <textarea name="caption" rows="5" class="w-full bg-base-800 border border-base-700 rounded-lg px-3 py-2 text-sm">{{ post.caption }}</textarea>
    {% if post.kind == 'reel' %}
    <label class="text-sm text-slate-400">Script</label>
    <textarea name="script" rows="5" class="w-full bg-base-800 border border-base-700 rounded-lg px-3 py-2 text-sm">{{ post.script }}</textarea>
    {% endif %}
    <button class="px-4 py-2 bg-base-800 hover:bg-base-700 rounded-lg text-sm">Save</button>
  </form>
  <div class="flex flex-wrap gap-2 pt-4 border-t border-base-700">
    {% for status in ['draft', 'ai_review', 'approved', 'ready', 'published'] %}
    <form method="post" action="{{ url_for('content.set_status', post_id=post.id) }}">
      <input type="hidden" name="status" value="{{ status }}">
      <button class="px-3 py-1.5 rounded-lg text-xs {{ 'bg-accent-600 text-white' if post.status == status else 'bg-base-800 text-slate-400 hover:text-white' }}">{{ status.replace('_',' ') }}</button>
    </form>
    {% endfor %}
  </div>
</div>
{% endblock %}
