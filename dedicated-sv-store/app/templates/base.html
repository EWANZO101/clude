<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OpsLabs Servers{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Dedicated server marketplace, custom builder and infrastructure management platform.{% endblock %}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface-950 text-text-primary min-h-screen flex flex-col">

</body>
</html>
