{% extends "base.html" %}
{% block body %}
<div class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="flex justify-center mb-8">
      <a href="{{ url_for('marketplace.index') }}" class="flex items-center gap-2">
        <span class="h-9 w-9 rounded-md bg-brand-600 flex items-center justify-center text-white font-bold">O</span>
        <span class="font-semibold text-text-primary tracking-tight text-lg">{{ app_name }}</span>
      </a>
    </div>
    <div class="card p-6 sm:p-8">
      <h1 class="text-xl font-semibold text-text-primary mb-1">{% block auth_title %}{% endblock %}</h1>
      <p class="text-sm text-text-secondary mb-6">{% block auth_subtitle %}{% endblock %}</p>
      {% block content %}{% endblock %}
    </div>
    {% block auth_footer %}{% endblock %}
  </div>
</div>
{% endblock %}
