{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div x-data="{ items: [{% for category, message in messages %}{id: {{ loop.index }}, category: '{{ category }}', message: {{ message|tojson }}}{% if not loop.last %}, {% endif %}{% endfor %}] }"
     class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-full max-w-sm px-4 sm:px-0">
  <template x-for="item in items" :key="item.id">
    <div x-show="items.includes(item)"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         x-init="setTimeout(() => items = items.filter(i => i.id !== item.id), 6000)"
         class="card px-4 py-3 flex items-start gap-3 shadow-panel"
         :class="{
           'border-status-success/40': item.category === 'success',
           'border-status-danger/40': item.category === 'error',
           'border-status-warning/40': item.category === 'warning',
           'border-status-info/40': item.category === 'info'
         }">
      <span class="mt-0.5 h-2 w-2 rounded-full flex-shrink-0"
            :class="{
              'bg-status-success': item.category === 'success',
              'bg-status-danger': item.category === 'error',
              'bg-status-warning': item.category === 'warning',
              'bg-status-info': item.category === 'info'
            }"></span>
      <p class="text-sm text-text-primary flex-1" x-text="item.message"></p>
      <button @click="items = items.filter(i => i.id !== item.id)" class="text-text-muted hover:text-text-primary">&times;</button>
    </div>
  </template>
</div>
{% endif %}
{% endwith %}
