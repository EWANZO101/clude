<div class="flex min-h-screen">
  <!-- Desktop / tablet sidebar -->
  <aside class="hidden md:flex md:flex-col w-56 lg:w-64 border-r border-surface-border bg-surface-card shrink-0">
    <div class="h-16 flex items-center px-5 border-b border-surface-border">
      <span class="font-semibold text-lg tracking-tight">Personal Platform</span>
    </div>
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
      {% for item in nav_items %}
        <a href="{{ item.url }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-surface hover:text-white transition">
          <span class="w-1.5 h-1.5 rounded-full bg-accent/70"></span>
          {{ item.label }}
        </a>
      {% endfor %}
    </nav>
    <div class="p-3 border-t border-surface-border">
      <a href="{{ url_for('auth.logout') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-surface hover:text-white transition">
        Log out
      </a>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top bar (mobile) -->
    <header class="md:hidden h-14 flex items-center justify-between px-4 border-b border-surface-border bg-surface-card sticky top-0 z-30">
      <span class="font-semibold">Personal Platform</span>
      <button onclick="document.getElementById('mobile-drawer').classList.remove('translate-x-full')" class="p-2 -mr-2">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </header>

    <main class="flex-1 p-4 md:p-6 pb-20 md:pb-6 max-w-6xl w-full mx-auto">
      {% block content %}{% endblock %}
    </main>

    <!-- Bottom nav (mobile) -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 h-16 bg-surface-card border-t border-surface-border flex items-center justify-around z-30">
      <a href="{{ url_for('dashboard.index') }}" class="flex flex-col items-center text-xs text-slate-300 gap-1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Home
      </a>
      <a href="{{ url_for('dashboard.settings_general') }}" class="flex flex-col items-center text-xs text-slate-300 gap-1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>
        Settings
      </a>
    </nav>
  </div>
</div>

<!-- Mobile drawer -->
<div id="mobile-drawer" class="md:hidden fixed inset-0 z-40 translate-x-full transition-transform duration-200">
  <div class="absolute inset-0 bg-black/50" onclick="document.getElementById('mobile-drawer').classList.add('translate-x-full')"></div>
  <div class="absolute right-0 top-0 bottom-0 w-72 bg-surface-card border-l border-surface-border p-4 flex flex-col">
    <div class="flex items-center justify-between mb-4">
      <span class="font-semibold">Menu</span>
      <button onclick="document.getElementById('mobile-drawer').classList.add('translate-x-full')" class="p-1">✕</button>
    </div>
    <nav class="flex-1 overflow-y-auto space-y-1">
      {% for item in nav_items %}
        <a href="{{ item.url }}" class="block px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-surface hover:text-white">{{ item.label }}</a>
      {% endfor %}
    </nav>
    <a href="{{ url_for('auth.logout') }}" class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-surface hover:text-white">Log out</a>
  </div>
</div>
