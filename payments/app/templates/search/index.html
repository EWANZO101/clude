{% extends "layout/base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<div class="max-w-2xl space-y-4">
  <form method="GET" class="flex gap-2">
    <input name="q" value="{{ query }}" placeholder="Search transactions, merchants, checklists…"
      class="flex-1 bg-surface border border-surface-border rounded-lg px-3 py-2 text-sm">
    <button class="bg-accent hover:bg-accent-hover text-white text-sm font-medium px-4 rounded-lg">Search</button>
  </form>
  <div class="bg-surface-card border border-surface-border rounded-2xl divide-y divide-surface-border">
    {% for r in results %}
      <a href="{{ r.url }}" class="block p-4 hover:bg-surface">
        <p class="text-xs uppercase tracking-wide text-slate-500">{{ r.category }}</p>
        <p class="text-sm text-slate-100">{{ r.title }}</p>
        {% if r.snippet %}<p class="text-xs text-slate-500 mt-0.5">{{ r.snippet }}</p>{% endif %}
      </a>
    {% else %}
      {% if query %}<p class="p-4 text-sm text-slate-500">No results for "{{ query }}".</p>{% endif %}
    {% endfor %}
  </div>
</div>
{% endblock %}
