<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ entity_name }} — barcode</title>
<style>
  :root {
    --bg: #0c1120; --panel: #161d33; --panel-border: #232b45;
    --text: #e6e9f2; --muted: #8b93a8; --accent: #6d5ef0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 32px; max-width: 420px; width: 100%; text-align: center;
  }
  .eyebrow { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  .barcode-box {
    background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 20px;
  }
  .barcode-box svg { width: 100%; height: auto; display: block; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, .btn {
    padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer;
    font: inherit; font-weight: 600; font-size: 14px; text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--panel-border); color: var(--text); }
  .copied-msg { color: #22c55e; font-size: 13px; margin-top: 10px; height: 16px; }

  @media print {
    body { background: #fff; color: #000; padding: 0; min-height: 0; display: block; }
    .card { border: none; padding: 0; max-width: none; }
    .eyebrow, .actions, .copied-msg { display: none; }
    h1 { color: #000; }
    .barcode-box { padding: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">StockTool &middot; {{ entity_type|capitalize }}</div>
    <h1>{{ entity_name }}</h1>
    <div class="barcode-box">{{ svg|safe }}</div>
    <div class="actions">
      <button class="btn-primary" onclick="window.print()">Print</button>
      <button class="btn-secondary" id="copyBtn">Copy link</button>
    </div>
    <div class="copied-msg" id="copiedMsg"></div>
  </div>
  <script>
    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        document.getElementById('copiedMsg').textContent = 'Link copied.';
      } catch (e) {
        document.getElementById('copiedMsg').textContent = window.location.href;
      }
    });
  </script>
</body>
</html>
