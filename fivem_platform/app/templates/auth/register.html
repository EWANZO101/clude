{% extends "base.html" %}
{% block title %}Sign up — {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-xl font-semibold text-white mb-6">Create an account</h1>

  <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm text-gray-400 mb-1">Username</label>
      <input type="text" name="username" required value="{{ username or '' }}"
        class="w-full bg-surface-card border border-surface-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Email</label>
      <input type="email" name="email" required value="{{ email or '' }}"
        class="w-full bg-surface-card border border-surface-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Password</label>
      <input type="password" name="password" required minlength="10"
        class="w-full bg-surface-card border border-surface-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
      <p class="text-xs text-gray-500 mt-1">At least 10 characters.</p>
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Confirm password</label>
      <input type="password" name="confirm_password" required minlength="10"
        class="w-full bg-surface-card border border-surface-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
    </div>
    <button type="submit" class="w-full bg-brand hover:bg-brand-hover text-white rounded-md py-2 text-sm font-medium transition">
      Create account
    </button>
  </form>

  <p class="text-sm text-gray-500 mt-6">
    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-brand hover:text-brand-hover">Log in</a>
  </p>
</div>
{% endblock %}
