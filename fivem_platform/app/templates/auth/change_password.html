{% extends "base.html" %}
{% block title %}Change password — {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-xl font-semibold text-white mb-6">Change password</h1>

  <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm text-gray-400 mb-1">Current password</label>
      <input type="password" name="current_password" required
        class="w-full bg-surface-card border border-surface-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">New password</label>
      <input type="password" name="new_password" required minlength="10"
        class="w-full bg-surface-card border border-surface-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
      <p class="text-xs text-gray-500 mt-1">At least 10 characters.</p>
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Confirm new password</label>
      <input type="password" name="confirm_password" required minlength="10"
        class="w-full bg-surface-card border border-surface-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
    </div>
    <button type="submit" class="w-full bg-brand hover:bg-brand-hover text-white rounded-md py-2 text-sm font-medium transition">
      Change password
    </button>
  </form>
</div>
{% endblock %}
