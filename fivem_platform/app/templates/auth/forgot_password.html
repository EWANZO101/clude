{% extends "base.html" %}
{% block title %}Forgot password — {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-xl font-semibold text-white mb-2">Reset your password</h1>
  <p class="text-sm text-gray-400 mb-6">Enter the email on your account and we'll send a reset link.</p>

  <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm text-gray-400 mb-1">Email</label>
      <input type="email" name="email" required
        class="w-full bg-surface-card border border-surface-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
    </div>
    <button type="submit" class="w-full bg-brand hover:bg-brand-hover text-white rounded-md py-2 text-sm font-medium transition">
      Send reset link
    </button>
  </form>

  <p class="text-sm text-gray-500 mt-6">
    Remembered it? <a href="{{ url_for('auth.login') }}" class="text-brand hover:text-brand-hover">Log in</a>
  </p>
</div>
{% endblock %}
