{% extends "base.html" %}
{% block title %}Verify 2FA — {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-xl font-semibold text-white mb-2">Enter your code</h1>
  <p class="text-sm text-gray-400 mb-6">From your authenticator app, or a backup code.</p>

  <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="code" required autofocus autocomplete="one-time-code" placeholder="123456"
      class="w-full bg-surface-card border border-surface-border rounded-md px-3 py-2 text-sm font-mono text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-brand">
    <button type="submit" class="w-full bg-brand hover:bg-brand-hover text-white rounded-md py-2 text-sm font-medium transition">
      Verify
    </button>
  </form>
</div>
{% endblock %}
