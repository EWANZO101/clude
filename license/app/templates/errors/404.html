{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="text-center">
        <p class="text-6xl font-bold text-gray-700">404</p>
        <h1 class="text-2xl font-bold mt-4">Page Not Found</h1>
        <p class="text-gray-500 mt-2">The page you're looking for doesn't exist.</p>
        <a href="{{ url_for('admin.dashboard') }}" class="inline-block mt-6 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg">
            Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
