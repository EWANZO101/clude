{% extends "base.html" %}
{% block title %}Edit {{ project.name }} — {{ tenant_name }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('projects.list_projects') }}">← Projects</a></p>
<div class="panel" style="max-width:480px;">
  <h1>Edit Project</h1>
  <form method="post">
    <label>Name</label>
    <input type="text" name="name" value="{{ project.name }}" required>
    <label>Job / PO code (optional)</label>
    <input type="text" name="code" value="{{ project.code or '' }}">
    <label>Description</label>
    <textarea name="description" rows="3" style="width:100%; padding:10px 12px; border-radius:7px; border:1px solid var(--panel-border); background:var(--bg); color:var(--text);">{{ project.description or '' }}</textarea>
    <button type="submit" style="margin-top:18px;">Save changes</button>
  </form>
</div>
{% endblock %}
