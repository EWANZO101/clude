{% extends "base.html" %}
{% block title %}Edit {{ user.username }} — {{ tenant_name }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('admin.list_users') }}">← Users</a></p>
<div class="panel" style="max-width:480px;">
  <h1>{{ user.username }}</h1>
  <p class="muted" style="font-size:12.5px;">Badge <code>{{ user.badge_code }}</code> — username isn't editable here to avoid breaking login history.</p>
  <form method="post">
    <label>Role</label>
    <select name="role" style="width:100%; padding:10px 12px; border-radius:7px; border:1px solid var(--panel-border); background:var(--bg); color:var(--text);">
      {% for role in roles %}<option value="{{ role }}" {{ 'selected' if role == user.role }}>{{ role }}</option>{% endfor %}
    </select>
    <button type="submit" style="margin-top:18px;">Save</button>
  </form>
</div>
{% endblock %}
