{% extends "base.html" %}
{% block title %}Bulk Add Wire — {{ tenant_name }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('wire.list_spools') }}">← Welding Wire</a></p>
<div class="panel" style="max-width:480px;">
  <h1>Bulk Add</h1>
  <p class="muted" style="font-size:13px;">
    Creates one individually-barcoded spool per unit, all sharing this spec, grouped under one batch for reporting.
  </p>
  <form method="post">
    <label>Wire type (e.g. ER70S-6)</label>
    <input type="text" name="wire_type" required autofocus>
    <label>Diameter (e.g. .035")</label>
    <input type="text" name="diameter">
    <label>Weight per spool (lbs)</label>
    <input type="text" name="weight_lbs">
    <label>Unit cost per spool</label>
    <input type="text" name="unit_cost">
    <label>Quantity</label>
    <input type="text" name="quantity" value="1" required>
    <label>Lot number (optional)</label>
    <input type="text" name="lot_number">
    <button type="submit" style="margin-top:18px;">Add Batch</button>
  </form>
</div>
{% endblock %}
