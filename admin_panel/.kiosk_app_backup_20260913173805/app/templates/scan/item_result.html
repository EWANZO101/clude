{% extends "base.html" %}
{% block title %}Scanned: {{ item.name }} — {{ tenant_name }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('scan.index') }}">← Scan another</a></p>

<div class="panel" style="max-width:480px;">
  <div class="muted" style="font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;">Item scanned</div>
  <h1 style="margin-top:4px;">{{ item.name }}</h1>
  <div class="muted">
    {{ item.quantity }} {{ item.unit or 'in stock' }}
    {% if item.sku %} — SKU {{ item.sku }}{% endif %}
  </div>

  <form method="post" action="{{ url_for('items.adjust_item', item_id=item.id) }}" style="margin-top:20px;">
    <input type="hidden" name="next" value="scan">
    <label>Project</label>
    <input type="text" name="project" value="{{ active_project.name if active_project else '' }}"
           placeholder="No active project — optional">
    <label>Quantity</label>
    <input type="text" name="qty" id="qty-input" value="1" style="max-width:100px;">
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button type="submit" name="delta" id="issue-btn" value="-1" style="flex:1;">Issue (−)</button>
      <button type="submit" name="delta" id="add-btn" value="1"
              style="flex:1; background:transparent; border:1px solid var(--panel-border); color:var(--text);">Add stock (+)</button>
    </div>
  </form>
</div>

<script>
  // The item adjust route takes a single signed `delta`. Rather than
  // duplicate quantity-parsing logic here, the buttons' submitted values
  // get overwritten with the (signed) quantity just before submit.
  var qtyInput = document.getElementById('qty-input');
  var issueBtn = document.getElementById('issue-btn');
  var addBtn = document.getElementById('add-btn');
  function sync() {
    var n = Math.abs(parseInt(qtyInput.value, 10)) || 1;
    issueBtn.value = String(-n);
    addBtn.value = String(n);
  }
  qtyInput.addEventListener('input', sync);
  sync();
</script>
{% endblock %}
