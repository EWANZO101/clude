{% extends "base.html" %}
{% block title %}Add Item — {{ tenant_name }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('items.list_items') }}">← Items</a></p>
<div class="panel" style="max-width:480px;">
  <h1>Add Item</h1>
  <form method="post">
    <label>Name</label>
    <input type="text" name="name" required autofocus>
    <label>SKU</label>
    <input type="text" name="sku">
    <label>Quantity</label>
    <input type="text" name="quantity" value="0">
    <label>Unit (optional)</label>
    <input type="text" name="unit" placeholder="e.g. box, ft, each">
    <label>Type / category</label>
    <input type="text" name="category" list="category-options" placeholder="e.g. Fasteners">
    <datalist id="category-options">
      {% for c in category_suggestions %}<option value="{{ c }}">{% endfor %}
    </datalist>
    <label>Location (optional)</label>
    <input type="text" name="location" list="location-options" placeholder="e.g. Shelf A3, Van 2">
    <datalist id="location-options">
      {% for l in location_suggestions %}<option value="{{ l }}">{% endfor %}
    </datalist>
    <label>Supplier (optional)</label>
    <input type="text" name="supplier" list="supplier-options" placeholder="e.g. Acme Fasteners Ltd">
    <datalist id="supplier-options">
      {% for s in supplier_suggestions %}<option value="{{ s }}">{% endfor %}
    </datalist>
    <label>Description (optional)</label>
    <textarea name="description" rows="3" style="width:100%; padding:10px 12px; border-radius:7px; border:1px solid var(--panel-border); background:var(--bg); color:var(--text);"></textarea>
    <label>Barcode (optional — leave blank to auto-generate)</label>
    <input type="text" name="barcode_code">
    <button type="submit" style="margin-top:18px;">Save</button>
  </form>
</div>
{% endblock %}
