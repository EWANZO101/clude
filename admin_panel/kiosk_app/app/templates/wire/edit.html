{% extends "base.html" %}
{% block title %}Edit Spool — {{ tenant_name }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('wire.list_spools') }}">← Welding Wire</a></p>
<div class="panel" style="max-width:480px;">
  <h1>Edit Spool</h1>
  <form method="post">
    <label>Wire type</label>
    <input type="text" name="wire_type" value="{{ spool.wire_type }}" required>
    <label>Diameter</label>
    <input type="text" name="diameter" value="{{ spool.diameter or '' }}">
    <label>Weight (lbs)</label>
    <input type="text" name="weight_lbs" value="{{ spool.weight_lbs or '' }}">
    <label>Unit cost</label>
    <input type="text" name="unit_cost" value="{{ spool.unit_cost or '' }}">
    <button type="submit" style="margin-top:18px;">Save changes</button>
  </form>
</div>
{% endblock %}
