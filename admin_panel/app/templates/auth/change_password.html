{% extends "base.html" %}
{% block title %}Change password — OpsLab Admin Panel{% endblock %}
{% block content %}
<div class="page-header">
  <div class="titles">
    <a href="{{ url_for('auth.profile') }}" class="crumb">← Profile</a>
    <h1>Change password</h1>
  </div>
</div>

<div class="panel" style="max-width:420px;">
  <form method="post">
    <label>Current password</label>
    <input type="password" name="current_password" required autofocus>
    <label>New password</label>
    <input type="password" name="new_password" required minlength="10">
    <label>Confirm new password</label>
    <input type="password" name="new_password_confirm" required minlength="10">
    <button type="submit" style="margin-top:18px;">Update password</button>
  </form>
</div>
{% endblock %}
