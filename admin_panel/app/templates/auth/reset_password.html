{% extends "base.html" %}
{% block title %}Set new password — OpsLab Admin Panel{% endblock %}
{% block content %}
<div class="panel">
  <h1 style="margin-bottom:6px;">Set a new password</h1>
  <p class="muted" style="margin-bottom:18px;">Choose something you haven't used before.</p>
  <form method="post">
    <label>New password</label>
    <input type="password" name="password" required minlength="10" autofocus>
    <label>Confirm new password</label>
    <input type="password" name="password_confirm" required minlength="10">
    <button type="submit" class="btn-block" style="margin-top:20px;">Set password</button>
  </form>
</div>
{% endblock %}
