{% extends "base.html" %}
{% block title %}Reset password — OpsLab Admin Panel{% endblock %}
{% block content %}
<div class="panel">
  <h1 style="margin-bottom:6px;">Reset your password</h1>
  <p class="muted" style="margin-bottom:18px;">We'll email you a link to reset it.</p>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <button type="submit" class="btn-block" style="margin-top:20px;">Send reset link</button>
  </form>
  <p class="muted" style="margin-top:18px; font-size:13px;"><a href="{{ url_for('auth.login') }}">← Back to log in</a></p>
</div>
{% endblock %}
