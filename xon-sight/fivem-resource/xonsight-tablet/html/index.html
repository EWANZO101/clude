<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Xon Sight Tablet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tablet" class="tablet hidden">
    <div class="bezel">
      <div class="bezel-top">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-text">XON<span class="accent">SIGHT</span> <span class="tag">TABLET</span></span>
        </div>
        <button id="closeBtn" class="close-btn" title="Close (Esc)">&times;</button>
      </div>
      <div class="screen">
        <iframe id="screenFrame" src="about:blank" frameborder="0"></iframe>
      </div>
      <div class="bezel-bottom">
        <span class="hint">Esc or click &times; to close</span>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
