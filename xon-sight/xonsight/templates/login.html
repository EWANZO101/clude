{% extends "guest_base.html" %}
{% block title %}Log in · Xon Sight{% endblock %}
{% block content %}
<div class="w-full max-w-sm">
  <div class="rounded-2xl border border-border bg-panel p-6 shadow-xl shadow-black/20">
    <h1 class="text-xl font-semibold text-white mb-1">Welcome back</h1>
    <p class="text-sm text-slate-500 mb-6">Log in to the evidence portal.</p>

    {% if error %}
    <p class="text-red-300 bg-red-500/10 border border-red-500/30 rounded-lg px-3 py-2 text-sm mb-4">{{ error }}</p>
    {% endif %}

    <form method="post" class="space-y-4">
      {% from "_macros.html" import csrf_field %}{{ csrf_field() }}
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Username</label>
        <input name="username" type="text" required autofocus
          class="w-full bg-base border border-border rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-accent/60 focus:ring-1 focus:ring-accent/40">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Password</label>
        <input name="password" type="password" required
          class="w-full bg-base border border-border rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-accent/60 focus:ring-1 focus:ring-accent/40">
      </div>
      <button type="submit"
        class="w-full px-4 py-2.5 rounded-lg bg-gradient-to-r from-accent to-accent2 text-base font-medium text-sm hover:opacity-90">
        Log in
      </button>
    </form>

    <p class="text-xs text-slate-500 mt-5 text-center">
      No account? <a href="{{ url_for('auth.signup') }}" class="text-accent hover:underline">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
