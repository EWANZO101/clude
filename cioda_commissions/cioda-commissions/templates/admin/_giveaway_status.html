{% set _st = {
  'active':    ('Active',    'rgba(34,197,94,.12)',  'rgba(34,197,94,.3)',  '#86efac'),
  'ended':     ('Ended',     'rgba(245,158,11,.12)', 'rgba(245,158,11,.3)', '#fcd34d'),
  'cancelled': ('Cancelled', 'rgba(239,68,68,.1)',   'rgba(239,68,68,.25)', '#fca5a5'),
}[g.status] %}
<span style="display:inline-block;padding:0.15rem 0.65rem;border-radius:999px;
             font-family:'Cinzel',serif;font-size:0.68rem;font-weight:700;white-space:nowrap;
             background:{{ _st[1] }};border:1px solid {{ _st[2] }};color:{{ _st[3] }};">{{ _st[0] }}</span>
