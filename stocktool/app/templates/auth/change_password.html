{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title"><i class="fas fa-key" style="color:#2563eb;"></i> Change Password</h1>
</div>
<div class="card" style="padding:20px;max-width:440px;">
  <form method="POST" action="{{ url_for('auth.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div style="margin-bottom:14px;">
      <label class="form-label">Current Password</label>
      <input type="password" name="current_password" class="form-input"
             required autocomplete="current-password" />
    </div>
    <div style="margin-bottom:14px;">
      <label class="form-label">New Password
        <span style="color:#6b7280;font-size:12px;">(min. 6 characters)</span>
      </label>
      <input type="password" name="new_password" class="form-input"
             required minlength="6" autocomplete="new-password" />
    </div>
    <div style="margin-bottom:20px;">
      <label class="form-label">Confirm New Password</label>
      <input type="password" name="confirm_password" class="form-input"
             required autocomplete="new-password" />
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save"></i> Update Password
      </button>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
