{% extends "base.html" %}
{% block content %}
<section class="relative min-h-[calc(100vh-3.5rem)] flex items-center justify-center py-16 px-4">
  <div class="absolute inset-0 grid-overlay pointer-events-none opacity-70"></div>
  <div class="relative w-full max-w-[400px] animate-fade-up">
    <div class="flex justify-center mb-6"><div class="w-11 h-11 rounded-xl border border-white/10 bg-white/[.03] flex items-center justify-center text-gray-300"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div></div>
    <h1 class="text-2xl font-semibold text-center tracking-tight text-white">Set a new password</h1>
    <p class="text-center text-sm text-gray-400 mt-2">Choose a strong password you'll remember.</p>
    <div class="mt-8 rounded-xl border border-white/[.08] bg-ink-900 p-6 sm:p-7">
      <form method="post" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5" for="password">New password</label>
          <input id="password" type="password" name="password" required autofocus autocomplete="new-password" class="form-input w-full px-3 h-10 text-sm" placeholder="••••••••">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5" for="confirm">Confirm password</label>
          <input id="confirm" type="password" name="confirm" required autocomplete="new-password" class="form-input w-full px-3 h-10 text-sm" placeholder="••••••••">
        </div>
        <button type="submit" class="ui-btn ui-btn-primary w-full !h-10">Update password</button>
      </form>
    </div>

  </div>
</section>
{% endblock %}
